name: Build Sync Agent EXE

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyodbc supabase

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --hidden-import=pyodbc --hidden-import=supabase sync_agent.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sync-agent-exe
        path: dist/sync_agent.exe
