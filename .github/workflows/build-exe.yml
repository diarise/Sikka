name: Build Sync Agent EXE

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sync_agent.py'
      - 'sync_agent.spec'
      - 'requirements.txt'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        # Uses sync_agent.spec (not inline --onefile flags) so the hidden-import
        # list for supabase's sub-packages actually gets applied.
        run: pyinstaller sync_agent.spec

      - name: Assemble release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\sync_agent.exe release\
          Copy-Item .env.example release\
          Copy-Item README.md release\
          Copy-Item install_service.ps1 release\
          # NOTE: .env, license.key, db_config.json are intentionally NOT copied here —
          # they either don't exist yet (fresh checkout) or are per-machine secrets that
          # must never ship inside a build artifact. Each merchant machine gets its own
          # .env at install time (see README.md step 2).

      - name: Upload EXE only
        uses: actions/upload-artifact@v4
        with:
          name: sync-agent-exe
          path: dist/sync_agent.exe

      - name: Upload full release package
        uses: actions/upload-artifact@v4
        with:
          name: sikka-sync-agent-release
          path: release/
